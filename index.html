<!doctype html>
<html lang="en">
  <head>
    <!-- HTML document information -->

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>titac game</title>
    <link rel="stylesheet" href="tictac.css" />
    
  </head>
  <body>
    <h1>Tic Tac Toe</h1>
    <main>
      <section>
        <form action="" id="playerform">
         <label for="player1">Player1:</lable>
         <input type="text" id="player1" name="player1">
         <label for="player2">Player2:</lable>
         <input type="text" id="player2" name="player2">
         <button onclick="showplayer()">SUBMIT</button>
        </form>
      </section>
      <section class="grid">
        <div class="box" id="box0"></div>
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
        <div class="box" id="box5"></div>
        <div class="box" id="box6"></div>
        <div class="box" id="box7"></div>
        <div class="box" id="box8"></div>
       
      </section>
      <section>
        <h2 id="turn">TURN: </h2>
        <p id="player1text">Player1:</p>
        <p id="player2text">Player2:</p>
      </section>

    </main>

     <script src="index.js"></script>
  </body>
  <footer></footer>
</html>
